name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Linter
        run: ruff check src tests
      - name: Pruebas offline (las que necesitan los XSD de TIA se omiten en CI)
        run: python -m pytest -q
